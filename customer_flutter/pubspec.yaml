name: customerapp
description: "Urban Steam - customer app"
publish_to: 'none'

# Mirrors the published Capacitor build (2.3.3 / 15); Play needs a higher code.
version: 2.4.0+16

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Networking + the localStorage replacement
  http: ^1.2.2
  shared_preferences: ^2.3.3

  # Splash: the same Lottie file the web app played
  lottie: ^3.1.3

  # Payments, sign-in, camera — the native pieces Capacitor plugins used to do
  razorpay_flutter: ^1.3.7
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  image_picker: ^1.1.2

  # Lets the Google mark be the exact SVG the web app inlines, rather than an
  # approximation drawn by hand.
  flutter_svg: ^2.0.10

  # The home banner can be a video as well as an image (Admin > Hero Section)
  video_player: ^2.9.2

  # The pin-your-door map. Tiles come from OpenStreetMap rather than Google so
  # it works without an API key or billing; the coordinates it produces are the
  # same latitude/longitude the captain's app navigates to.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Notifications, sharing, dialling, maps, invoices
  flutter_local_notifications: ^17.2.4
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  pdf: ^3.11.1
  printing: ^5.13.4

  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/anim/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
